plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.20.1'
group = 'com.mod-buildcraft'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def minecraftVersion = '1.20.1'
def runDirectory = file('run')

minecraft {
    mappings channel: 'official', version: minecraftVersion
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.isFile()) {
        accessTransformer = at
    }

    runs {
        configureEach {
            workingDirectory runDirectory
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'forge,buildcraftlib'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods {
                buildcraft { source sourceSets.main }
            }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"
    compileOnly fg.deobf('maven.modrinth:jei:MybRLD9h')
    compileOnly fg.deobf('maven.modrinth:jade:dldgfOqB')
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.3"
    testImplementation "org.junit.jupiter:junit-jupiter-params:5.9.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.3"
}

tasks.named('jar', Jar) {
    // Disable monolithic jar to ensure only the six independent modular jars are produced
    enabled = false
}

// 1. BuildCraft Core (includes Shared Library and MJ API)
def jarCore = tasks.register('jarCore', Jar) {
    archiveFileName = "buildcraft-core-${project.version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(sourceSets.main.output) {
        include 'buildcraft/api/**'
        include 'buildcraft/lib/**'
        include 'buildcraft/core/**'
        include 'assets/buildcraft/**'
        include 'assets/buildcraftcore/**'
        include 'assets/buildcraftlib/**'
        include 'data/buildcraft/**'
        include 'data/buildcraftcore/**'
        include 'data/buildcraftlib/**'
        include 'META-INF/accesstransformer.cfg'
        include 'META-INF/services/**'
        include 'pack.mcmeta'
    }
    from('src/main/resources-modules/core') {
        include 'META-INF/mods.toml'
    }
    manifest {
        attributes([
            'Specification-Title': 'BuildCraft Core',
            'Specification-Vendor': 'BuildCraft Team',
            'Specification-Version': project.version,
            'Implementation-Title': 'BuildCraft Core',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'BuildCraft Team'
        ])
    }
}


// ----------------------------------------------------------------------------
// Independent module build tasks
// ----------------------------------------------------------------------------
tasks.register('buildCore') {
    group = 'buildcraft'
    description = 'Builds buildcraft-core jar'
    dependsOn jarCore
}

tasks.register('buildTransport') {
    group = 'buildcraft'
    description = 'Builds buildcraft-transport jar'
    dependsOn jarTransport
}

tasks.register('buildSilicon') {
    group = 'buildcraft'
    description = 'Builds buildcraft-silicon jar'
    dependsOn jarSilicon
}

tasks.register('buildFactory') {
    group = 'buildcraft'
    description = 'Builds buildcraft-factory jar'
    dependsOn jarFactory
}

tasks.register('buildBuilders') {
    group = 'buildcraft'
    description = 'Builds buildcraft-builders jar'
    dependsOn jarBuilders
}

tasks.register('buildRobotics') {
    group = 'buildcraft'
    description = 'Builds buildcraft-robotics jar'
    dependsOn jarRobotics
}

tasks.named('assemble') {
    dependsOn jarCore, jarTransport, jarSilicon, jarFactory, jarBuilders, jarRobotics
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:none')
}

// ----------------------------------------------------------------------------
// ForgeGradle Reobfuscation Pipeline Mount
// ----------------------------------------------------------------------------
reobf {
    create('jarCore')
    create('jarTransport')
    create('jarSilicon')
    create('jarFactory')
    create('jarBuilders')
    create('jarRobotics')
}

def modularTasks = [
    [jar: jarCore, reobf: 'reobfJarCore', build: 'buildCore'],
    [jar: jarTransport, reobf: 'reobfJarTransport', build: 'buildTransport'],
    [jar: jarSilicon, reobf: 'reobfJarSilicon', build: 'buildSilicon'],
    [jar: jarFactory, reobf: 'reobfJarFactory', build: 'buildFactory'],
    [jar: jarBuilders, reobf: 'reobfJarBuilders', build: 'buildBuilders'],
    [jar: jarRobotics, reobf: 'reobfJarRobotics', build: 'buildRobotics']
]

// Wire each Jar task to be finalized by its corresponding reobf task,
// and make each independent build task depend on the reobfuscated jar.
modularTasks.each { mod ->
    mod.jar.configure {
        finalizedBy(mod.reobf)
    }
    tasks.named(mod.build) {
        dependsOn(mod.jar, mod.reobf)
    }
}

tasks.named('assemble') {
    dependsOn 'reobfJarCore', 'reobfJarTransport', 'reobfJarSilicon', 'reobfJarFactory', 'reobfJarBuilders', 'reobfJarRobotics'
}

tasks.named('jar', Jar) {
    dependsOn jarCore, jarTransport, jarSilicon, jarFactory, jarBuilders, jarRobotics
}

artifacts {
    archives jarCore
    archives jarTransport
    archives jarSilicon
    archives jarFactory
    archives jarBuilders
    archives jarRobotics
}

afterEvaluate {
    def rj = tasks.findByName('reobfJar')
    if (rj != null) {
        rj.dependsOn 'reobfJarCore', 'reobfJarTransport', 'reobfJarSilicon', 'reobfJarFactory', 'reobfJarBuilders', 'reobfJarRobotics'
        rj.enabled = false
    }
}


